name: Linux and macOS bundles

# Builds unsigned Linux (.deb, .rpm, .AppImage) and macOS (.dmg) bundles with
# the official ONNX Runtime staged as a bundle resource, then attaches them to
# an existing GitHub release. Run manually: Actions -> this workflow -> Run.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the bundles to"
        required: true
        default: "v1.1.0"

permissions:
  contents: read

jobs:
  bundle:
    name: Bundles (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: mnemo-linux
            args: "--config src-tauri/tauri.onnxruntime.linux.conf.json"
          - platform: macos-latest
            artifact: mnemo-macos
            args: "--target universal-apple-darwin --config src-tauri/tauri.onnxruntime.macos.conf.json"

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            ${{
              matrix.platform == 'macos-latest'
                && 'aarch64-apple-darwin,x86_64-apple-darwin'
                || ''
            }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: bundle-${{ matrix.platform }}
          cache-on-failure: true

      - name: Install frontend dependencies
        run: bun install

      - name: Stage ONNX Runtime (macOS, Apple silicon)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          version=1.31.0
          sha256=1031b36dd3bdaa8d976a6130d9cf2a05e9be320b93ae804f8427b91dc3432afc
          curl -fsSL -o "$RUNNER_TEMP/ort.tgz" \
            "https://github.com/microsoft/onnxruntime/releases/download/v$version/onnxruntime-osx-arm64-$version.tgz"
          echo "$sha256  $RUNNER_TEMP/ort.tgz" | shasum -a 256 -c -
          tar xzf "$RUNNER_TEMP/ort.tgz" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/onnxruntime-osx-arm64-$version/lib/libonnxruntime.$version.dylib" src-tauri/libonnxruntime.dylib
          test -s src-tauri/libonnxruntime.dylib

      - name: Stage ONNX Runtime (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          version=1.31.0
          sha256=cc5c72baf5ae5c8238a6841f0897227be2d02826b9cf98eaf02fdefaeeb03a57
          curl -fsSL -o "$RUNNER_TEMP/ort.tgz" \
            "https://github.com/microsoft/onnxruntime/releases/download/v$version/onnxruntime-linux-x64-$version.tgz"
          echo "$sha256  $RUNNER_TEMP/ort.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/ort.tgz" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/onnxruntime-linux-x64-$version/lib/libonnxruntime.so.$version" src-tauri/libonnxruntime.so
          test -s src-tauri/libonnxruntime.so

      - name: Build bundles
        run: bunx tauri build ${{ matrix.args }}

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/*/release/bundle/**
          if-no-files-found: error

  attach:
    name: Attach to release
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload installable assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir staged
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' \) -exec cp {} staged/ \;
          ls -la staged
          test -n "$(ls staged)"
          gh release upload "$TAG" staged/* --clobber --repo "$GITHUB_REPOSITORY"
